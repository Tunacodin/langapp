name: iOS build (unsigned IPA)

# macOS runner uzerinde imzasiz bir .ipa uretir. Ciktiyi indirip Windows'ta
# Sideloadly / AltStore ile (ucretsiz Apple ID) iPhone'a kurabilirsin.
# Elle tetikle: Actions sekmesi -> "iOS build (unsigned IPA)" -> Run workflow.

# Expo SDK 55 (RN 0.83) imzasiz .ipa uretir (Sideloadly icin yedek yol).
# Esas dagitim EAS Build + EAS Update (OTA) uzerinden; bu yuzden otomatik push
# tetigi kapali, yalniz elle (workflow_dispatch) calisir. Xcode 26 kullanir.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 55 minimum Xcode 26 ister (EAS 26.2 kullanir). SDK55'te expo-modules-jsi
      # olmadigi icin 57'deki Swift 6.2 build engeli burada yok. En guncel kararliyi sec.
      - name: Xcode 26 sec
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Prebuild iOS (sadece native proje)
        run: npx expo prebuild -p ios --no-install

      - name: Pod install (CocoaPods -> .xcworkspace)
        run: |
          set -eo pipefail
          cd ios
          pod install --repo-update

      - name: Build unsigned .app
        run: |
          set -eo pipefail
          SCHEME=$(basename ios/*.xcodeproj .xcodeproj)
          WS="ios/$SCHEME.xcworkspace"
          echo "Scheme: $SCHEME | Workspace: $WS"
          ls -la ios
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          set -eo pipefail
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: mobile/app-unsigned.ipa
          if-no-files-found: error
