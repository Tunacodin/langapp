name: iOS build (unsigned IPA)

# macOS runner uzerinde imzasiz bir .ipa uretir. Ciktiyi indirip Windows'ta
# Sideloadly / AltStore ile (ucretsiz Apple ID) iPhone'a kurabilirsin.
# Elle tetikle: Actions sekmesi -> "iOS build (unsigned IPA)" -> Run workflow.

# NOT: Ham xcodebuild ile Expo SDK 57 / expo-modules-jsi, GitHub runner'larindaki
# hicbir Xcode ile derlenmiyor (Xcode 26 -> Swift "weak let" + RuntimeScheduler
# interop hatasi; Xcode 16.4 -> paket Swift 6.2 istiyor). Bu yuzden otomatik push
# tetigi kapatildi; iOS derlemesi icin EAS Build kullaniliyor (bkz. eas.json).
# Yine de elle denemek istersen Actions'tan manuel calistirabilirsin.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      # expo-modules-jsi Swift 6.2 (Xcode 26) istiyor; ama Xcode 26.3 RuntimeScheduler
      # interop kontrolunu sikilastirdigi icin patliyor. 26.1 ikisini de saglar.
      - name: Xcode 26.1 sec
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps
        run: npm install

      - name: Prebuild iOS (sadece native proje)
        run: npx expo prebuild -p ios --no-install

      - name: Pod install (CocoaPods -> .xcworkspace)
        run: |
          set -eo pipefail
          cd ios
          pod install --repo-update

      - name: Build unsigned .app
        run: |
          set -eo pipefail
          SCHEME=$(basename ios/*.xcodeproj .xcodeproj)
          WS="ios/$SCHEME.xcworkspace"
          echo "Scheme: $SCHEME | Workspace: $WS"
          ls -la ios
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA
        run: |
          set -eo pipefail
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          echo "App: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr app-unsigned.ipa Payload
          ls -lh app-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: mobile/app-unsigned.ipa
          if-no-files-found: error
