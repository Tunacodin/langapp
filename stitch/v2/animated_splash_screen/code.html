<script>
  (function() {
    const progressBar = document.getElementById('splash-progress');
    const statusText = document.getElementById('splash-status');
    
    const steps = [
      { progress: '25%', text: 'Bilişsel model yükleniyor...' },
      { progress: '58%', text: 'FSRS bellek haritaları senkronize ediliyor...' },
      { progress: '85%', text: 'Akustik Shadowing motoru hazırlanıyor...' },
      { progress: '100%', text: 'Zihinsel akış hazır.' }
    ];

    let currentStep = 0;
    
    function advanceProgress() {
      if (currentStep < steps.length) {
        if (progressBar) progressBar.style.width = steps[currentStep].progress;
        if (statusText) statusText.textContent = steps[currentStep].text;
        currentStep++;
        const nextDelay = currentStep === steps.length ? 600 : 750;
        setTimeout(advanceProgress, nextDelay);
      }
    }

    setTimeout(advanceProgress, 300);
  })();
